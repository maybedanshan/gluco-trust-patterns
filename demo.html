<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlucoTrust 实验浏览器</title>
<style>body{font:16px system-ui;margin:40px auto;padding:0 24px;max-width:1100px;background:#f3f7f8;color:#15313d}h1{font-size:40px}select{padding:10px;margin:8px}table{width:100%;border-collapse:collapse;background:white}td,th{padding:12px;text-align:left;border-bottom:1px solid #dde7e9}.scroll{max-height:65vh;overflow:auto}th{position:sticky;top:0;background:#dceeea}small{color:#456}</style>
<h1>GlucoTrust</h1><p>相同删点比例，不同缺失位置，报告指标会怎样变化？</p><p><strong>/*SOURCE*/</strong></p>
<label>参与者<select id="person"></select></label><label>缺失模式<select id="mode"></select></label><label>请求比例<select id="ratio"></select></label>
<p id="summary"></p><small>偏差 = 删除后 − 参考值；TIR 为百分点。删点比例与缺失时间比例分别展示。不补齐断连时间。</small>
<div class="scroll"><table><thead><tr><th>参与者</th><th>模式</th><th>种子</th><th>删点 / 缺失时间</th><th>平均血糖偏差 mg/dL</th><th>TIR 偏差 pp</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>const data=/*RESULTS*/[];const fields={person:'participant',mode:'mode',ratio:'requested_ratio'};for(const [id,key] of Object.entries(fields)){const el=document.getElementById(id);for(const value of ['全部',...new Set(data.map(r=>String(r[key])))]){const o=document.createElement('option');o.textContent=value;el.append(o)}el.onchange=render}function render(){const selected=data.filter(r=>Object.entries(fields).every(([id,key])=>document.getElementById(id).value==='全部'||String(r[key])===document.getElementById(id).value));document.getElementById('summary').textContent=`${selected.length} 次实验；可按参与者、模式和比例检查种子差异。`;const body=document.getElementById('rows');body.replaceChildren();for(const r of selected){const tr=document.createElement('tr');for(const value of [r.participant,r.mode,r.seed,`${(100*r.point_missing_ratio).toFixed(1)}% / ${(100*r.time_missing_ratio).toFixed(1)}%`,r.mean_bias_mg_dl.toFixed(3),r.tir_bias_pp.toFixed(3)]){const td=document.createElement('td');td.textContent=value;tr.append(td)}body.append(tr)}}render();</script></html>
